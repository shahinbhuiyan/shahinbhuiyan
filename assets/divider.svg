<svg xmlns="http://www.w3.org/2000/svg" width="900" height="6" viewBox="0 0 900 6" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff5900" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffb07a"/>
      <stop offset="1" stop-color="#ff5900" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes slide{from{transform:translateX(-300px)}to{transform:translateX(900px)}}
    .glow{animation:slide 3s linear infinite}
  </style>
  <rect y="1" width="900" height="4" rx="2" fill="#ff5900" opacity=".55"/>
  <rect class="glow" y="0" width="300" height="6" rx="3" fill="url(#g)"/>
</svg>
