<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-450px)}}
    @keyframes fade{0%,100%{opacity:.75}50%{opacity:1}}
    .w1{animation:wave 10s linear infinite}
    .w2{animation:wave 7s linear infinite}
    .w3{animation:wave 5s linear infinite}
    .msg{animation:fade 3s ease-in-out infinite}
  </style>
  <path class="w1" fill="#ff5900" opacity=".30" d="M0 34 q112.5 -30 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V110 H0 Z"/>
  <path class="w2" fill="#ff5900" opacity=".55" d="M0 46 q112.5 -26 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V110 H0 Z"/>
  <path class="w3" fill="#ff5900" d="M0 58 q112.5 -22 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V110 H0 Z"/>
  <text class="msg" x="450" y="92" text-anchor="middle" font-size="16" font-weight="600" fill="#fff" letter-spacing="1">Thanks for visiting 🧡</text>
</svg>
