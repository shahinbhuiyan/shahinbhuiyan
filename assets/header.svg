<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" font-family="Georgia, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5900"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-450px)}}
    @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    .w1{animation:wave 9s linear infinite}
    .w2{animation:wave 6s linear infinite}
    .name{animation:rise 1s ease-out both}
    .sub{animation:rise 1s ease-out .4s both}
    .tags{animation:rise 1s ease-out .8s both}
    .b1{animation:float 5s ease-in-out infinite}
    .b2{animation:float 7s ease-in-out infinite 1s}
    .b3{animation:float 6s ease-in-out infinite 2s}
  </style>
  <rect width="900" height="230" fill="url(#bg)"/>
  <circle class="b1" cx="90" cy="60" r="34" fill="#fff" opacity=".12"/>
  <circle class="b2" cx="800" cy="50" r="46" fill="#fff" opacity=".10"/>
  <circle class="b3" cx="700" cy="140" r="18" fill="#fff" opacity=".14"/>
  <text class="name" x="450" y="98" text-anchor="middle" font-size="56" font-weight="700" fill="#fff">Shahin Bhuiyan</text>
  <text class="sub" x="450" y="138" text-anchor="middle" font-size="22" fill="#fff">Full Stack Web &amp; App Developer</text>
  <text class="tags" x="450" y="168" text-anchor="middle" font-size="15" fill="#fff" opacity=".9" letter-spacing="3">PHP  •  LARAVEL  •  WORDPRESS</text>
  <path class="w1" fill="#fff" opacity=".18" d="M0 196 q112.5 -34 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V230 H0 Z"/>
  <path class="w2" fill="#fff" opacity=".30" d="M0 208 q112.5 -26 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 V230 H0 Z"/>
</svg>
