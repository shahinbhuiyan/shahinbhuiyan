<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" font-family="Georgia, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @keyframes cycle{
      0%{opacity:0;transform:translateY(14px)}
      5%{opacity:1;transform:translateY(0)}
      22%{opacity:1;transform:translateY(0)}
      27%{opacity:0;transform:translateY(-14px)}
      100%{opacity:0;transform:translateY(-14px)}
    }
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    text{font-size:30px;font-weight:600;fill:#ff5900;animation:cycle 12s ease-in-out infinite both}
    .t2{animation-delay:3s}.t3{animation-delay:6s}.t4{animation-delay:9s}
    .cur{animation:blink 1s steps(1) infinite}
  </style>
  <g text-anchor="middle">
    <text class="t1" x="450" y="42">Hi 👋, I'm Shahin Bhuiyan</text>
    <text class="t2" x="450" y="42">Full Stack Web &amp; App Developer</text>
    <text class="t3" x="450" y="42">PHP | Laravel | WordPress Expert</text>
    <text class="t4" x="450" y="42">Let's Build Something Great!</text>
  </g>
  <rect class="cur" x="450" y="60" width="0" height="0" fill="#ff5900"/>
</svg>
