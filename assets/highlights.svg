<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#ff5900" flood-opacity="0.25"/>
    </filter>
    <clipPath id="cp"><rect width="205" height="120" rx="12"/></clipPath>
    <g id="card">
      <rect width="205" height="120" rx="12" fill="#FFF4EC" stroke="#FFD9C2"/>
      <rect width="6" height="120" fill="#ff5900" clip-path="url(#cp)"/>
    </g>
  </defs>
  <style>
    @keyframes pop{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes ping{0%{r:6;opacity:1}100%{r:16;opacity:0}}
    .a{animation:pop .8s ease-out both}
    .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
    .n{font-size:40px;font-weight:800;fill:#ff5900}
    .l{font-size:14px;font-weight:600;fill:#3B2A20}
    .ring{animation:ping 1.8s ease-out infinite}
  </style>
  <g transform="translate(10,15)" filter="url(#sh)"><g class="a d1"><use href="#card"/>
    <text class="n" x="102" y="62" text-anchor="middle">5+</text><text class="l" x="102" y="92" text-anchor="middle">Years Experience</text></g></g>
  <g transform="translate(235,15)" filter="url(#sh)"><g class="a d2"><use href="#card"/>
    <text class="n" x="102" y="62" text-anchor="middle">6</text><text class="l" x="102" y="92" text-anchor="middle">Core Services</text></g></g>
  <g transform="translate(460,15)" filter="url(#sh)"><g class="a d3"><use href="#card"/>
    <text class="n" x="102" y="62" text-anchor="middle">4</text><text class="l" x="102" y="92" text-anchor="middle">Tech Categories</text></g></g>
  <g transform="translate(685,15)" filter="url(#sh)"><g class="a d4"><use href="#card"/>
    <circle class="ring" cx="62" cy="52" r="6" fill="#3DDC84"/>
    <circle cx="62" cy="52" r="6" fill="#3DDC84"/>
    <text class="n" x="128" y="62" text-anchor="middle" style="font-size:32px">Open</text>
    <text class="l" x="102" y="92" text-anchor="middle">For Freelance Work</text></g></g>
</svg>
