<svg xmlns="http://www.w3.org/2000/svg" width="900" height="335" viewBox="0 0 900 335" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="145%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#ff5900" flood-opacity="0.25"/>
    </filter>
    <clipPath id="cp"><rect width="280" height="140" rx="12"/></clipPath>
    <g id="card">
      <rect width="280" height="140" rx="12" fill="#FFF4EC" stroke="#FFD9C2"/>
      <rect width="6" height="140" fill="#ff5900" clip-path="url(#cp)"/>
    </g>
  </defs>
  <style>
    @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
    .a{animation:rise .8s ease-out both}
    .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}
    .d4{animation-delay:.55s}.d5{animation-delay:.7s}.d6{animation-delay:.85s}
    .bar{animation:pulse 2.5s ease-in-out infinite}
    .t{font-size:18px;font-weight:700;fill:#ff5900}
    .p{font-size:13px;fill:#3B2A20}
  </style>

  <g transform="translate(10,10)" filter="url(#sh)"><g class="a d1"><use href="#card"/>
    <text class="t" x="24" y="35">🌐 Web Development</text>
    <text class="p" x="24" y="65">Modern, responsive, SEO-friendly</text><text class="p" x="24" y="85">websites with PHP, Laravel</text><text class="p" x="24" y="105">and WordPress.</text></g></g>
  <g transform="translate(310,10)" filter="url(#sh)"><g class="a d2"><use href="#card"/>
    <text class="t" x="24" y="35">📱 App Development</text>
    <text class="p" x="24" y="65">Cross-platform mobile and web</text><text class="p" x="24" y="85">apps using React Native and</text><text class="p" x="24" y="105">modern JS stacks.</text></g></g>
  <g transform="translate(610,10)" filter="url(#sh)"><g class="a d3"><use href="#card"/>
    <text class="t" x="24" y="35">🛒 E-Commerce</text>
    <text class="p" x="24" y="65">Complete stores with payment</text><text class="p" x="24" y="85">gateways, admin panels and</text><text class="p" x="24" y="105">inventory systems.</text></g></g>
  <g transform="translate(10,175)" filter="url(#sh)"><g class="a d4"><use href="#card"/>
    <text class="t" x="24" y="35">⚙️ Custom Systems</text>
    <text class="p" x="24" y="65">Custom PHP / Laravel admin</text><text class="p" x="24" y="85">panels, CRM, ERP and business</text><text class="p" x="24" y="105">management tools.</text></g></g>
  <g transform="translate(310,175)" filter="url(#sh)"><g class="a d5"><use href="#card"/>
    <text class="t" x="24" y="35">🔌 API Integration</text>
    <text class="p" x="24" y="65">REST API development and</text><text class="p" x="24" y="85">third-party integrations</text><text class="p" x="24" y="105">(payment, SMS, courier).</text></g></g>
  <g transform="translate(610,175)" filter="url(#sh)"><g class="a d6"><use href="#card"/>
    <text class="t" x="24" y="35">🎨 UI/UX Design</text>
    <text class="p" x="24" y="65">Clean, modern interfaces with</text><text class="p" x="24" y="85">Figma wireframes and</text><text class="p" x="24" y="105">pixel-perfect implementation.</text></g></g>
</svg>
